workflows:
  swiftgram-build:
    name: Swiftgram Build
    labels:
      - swiftgram
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: 26.2
      vars:
        # Fake password for fake-codesigning (required by Make.py but not used for real signing)
        TELEGRAM_CODESIGNING_GIT_PASSWORD: "codemagic"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
        - pattern: beta
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Checkout submodules
        script: |
          git submodule update --init --recursive --depth=1

      - name: Calculate build number
        script: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          BUILD_NUMBER_OFFSET=$(cat build_number_offset)
          export BUILD_NUMBER=$(($COMMIT_COUNT + $BUILD_NUMBER_OFFSET))
          echo "BUILD_NUMBER=$BUILD_NUMBER"
          # Persist for subsequent steps
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $CM_ENV

      - name: Build Swiftgram
        script: |
          python3 build-system/Make/Make.py \
            --overrideXcodeVersion \
            --cacheDir="$HOME/Library/Caches/telegram-bazel-cache" \
            build \
            --configurationPath="build-system/codemagic-configuration.json" \
            --codesigningInformationPath="build-system/fake-codesigning" \
            --buildNumber="$BUILD_NUMBER" \
            --configuration=release_arm64 \
            --outputBuildArtifactsPath="build/artifacts"
    artifacts:
      - build/artifacts/Swiftgram.ipa
      - build/artifacts/Swiftgram.DSYMs.zip
    publishing:
      email:
        recipients:
          - user@example.com  # TODO: замени на свой email
        notify:
          success: false
          failure: true
